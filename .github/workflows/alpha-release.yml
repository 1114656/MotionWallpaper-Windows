name: Alpha Release

on:
  push:
    tags:
      - 'v*-alpha.*'

permissions:
  contents: write

concurrency:
  group: alpha-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-package-and-release:
    runs-on: windows-2025-vs2026
    timeout-minutes: 45

    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Verify release tag
        shell: pwsh
        run: |
          $version = (Get-Content -LiteralPath VERSION -Raw).Trim()
          $expectedTag = "v$version"
          if ($env:GITHUB_REF_NAME -ne $expectedTag) {
            throw "发布标签 $env:GITHUB_REF_NAME 与 VERSION 中的 $expectedTag 不一致。"
          }

      - name: Build and test release payload
        shell: pwsh
        run: |
          $logPath = Join-Path $env:RUNNER_TEMP 'alpha-release-build.log'
          try {
            & .\scripts\build-native.ps1 *>&1 | Tee-Object -FilePath $logPath
            if ($LASTEXITCODE -ne 0) {
              throw "发布构建脚本退出码：$LASTEXITCODE"
            }
          } catch {
            $_ | Out-String | Tee-Object -FilePath $logPath -Append | Write-Host
            throw
          }

      - name: Publish release failure diagnosis
        if: failure()
        shell: pwsh
        run: |
          $logPath = Join-Path $env:RUNNER_TEMP 'alpha-release-build.log'
          if (-not (Test-Path -LiteralPath $logPath)) {
            Write-Host '::error title=Alpha Release 失败::发布构建未生成诊断日志。'
            exit 0
          }
          $pattern = '(?i)(MotionWallpaper native tests failed|Native (restore|build|tests) failed|fatal error|:\s*error\s+(MSB|C|LNK|NU)\d+|exception|FFmpeg|退出码|生成失败|测试失败|throw)'
          $matches = @(Select-String -LiteralPath $logPath -Pattern $pattern |
            Select-Object -Last 20 | ForEach-Object {
              $line = $_.Line.Trim()
              if ($line.Length -gt 600) { $line = $line.Substring(0, 600) + '…' }
              $line
            })
          if (-not $matches) {
            $matches = @(Get-Content -LiteralPath $logPath -Tail 30)
          }
          $message = ($matches -join ' | ')
          if ($message.Length -gt 12000) {
            $message = $message.Substring($message.Length - 12000)
          }
          $message = $message.Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
          Write-Host "::error title=Alpha Release 诊断::$message"

      - name: Package and validate alpha archive
        shell: pwsh
        run: .\scripts\package-alpha.ps1

      - name: Build and validate single EXE installer
        shell: pwsh
        run: |
          .\scripts\install-inno-tool.ps1
          .\scripts\build-installer.ps1 -SkipBuild
          .\scripts\test-installer.ps1

      - name: Create public prerelease
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = (Get-Content -LiteralPath VERSION -Raw).Trim()
          $archive = "artifacts/MotionWallpaper-v$version-windows-x64.zip"
          $checksum = "$archive.sha256"
          $installer = "artifacts/MotionWallpaper-v$version-setup-windows-x64.exe"
          $installerChecksum = "$installer.sha256"
          $notes = @'
          MotionWallpaper 的公开 Alpha 测试版本，借鉴 macOS 动态屏保体验，面向 Windows 原生开发。

          ### 主要内容

          - 支持动态壁纸、动态屏保和多显示器。
          - 支持原画、自动平衡和低功耗性能档位。
          - 允许删除源视频，同时保留封面、名称和已有性能副本。
          - 修复 NVIDIA 与物理 GPU 硬件解码判断，旧显卡可使用 CPU 解码与物理 GPU 合成。
          - 无可用 GPU 时自动生成 H.264 CPU 友好副本，并按实际负载动态调节软件渲染帧率。
          - 优化壁纸切换、桌面宿主复用和播放状态更新，降低 WARP 路径的内存与 CPU 占用。
          - 提供可选择安装位置的中英文单 EXE 安装器，并统一应用、任务栏和安装器图标。
          - 安装版与便携版统一把配置、日志、分组和壁纸放在程序目录，升级时安全迁移旧数据。
          - 卸载安装版时会完整删除程序和全部用户数据，不再在 C 盘保留媒体库。
          - 精简 Windows App SDK 卫星资源，只保留简体中文和英文。

          ### 下载与校验

          普通用户建议下载 `MotionWallpaper-v{{VERSION}}-setup-windows-x64.exe`，可在向导中选择安装位置。免安装使用可下载 `MotionWallpaper-v{{VERSION}}-windows-x64.zip`。可使用各自随附的 `.sha256` 文件校验完整性。

          ### Alpha 提醒

          这是未签名的预发布版本，Windows SmartScreen 可能显示警告。请仅用于测试。安装版卸载会同时删除壁纸、分组、配置和日志，请提前备份需要保留的内容；便携版升级时请保留程序旁的 `Wallpapers` 和 `Config`。遇到问题请通过仓库 Issue 反馈。
          '@
          $notes = $notes.Replace('{{VERSION}}', $version)
          gh release create $env:GITHUB_REF_NAME $installer $installerChecksum $archive $checksum `
            --repo $env:GITHUB_REPOSITORY `
            --title "MotionWallpaper v$version（Alpha 测试版）" `
            --notes $notes `
            --prerelease `
            --verify-tag
          if ($LASTEXITCODE -ne 0) {
            throw "GitHub Release 创建失败，退出码：$LASTEXITCODE"
          }
